<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simplex Lab — Pantalla principal</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.page{font-family:'DM Sans',sans-serif;background:#EEF1FB;color:#0F1B3D;min-height:960px;box-sizing:border-box;padding:40px 48px 56px}
.wrap{max-width:1184px;margin:0 auto}
.main{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:26px;align-items:start}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 28px rgba(75,78,235,.08);padding:28px;box-sizing:border-box}
.lbl{font-size:14px;color:#4F5B80;margin:0 0 8px}
.inp{box-sizing:border-box;height:38px;border:1px solid #D5DAF0;background:#F6F7FD;border-radius:10px;font:500 16px 'DM Sans',sans-serif;color:#0F1B3D;text-align:center;padding:0 6px}
.op{width:38px;height:38px;border:0;border-radius:10px;background:#E6E7FB;color:#4B4EEB;font:700 16px 'DM Sans',sans-serif}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:#4F5B80}
.seg{display:flex;background:#EEF1FB;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;background:transparent;padding:10px 14px;font:500 14px 'DM Sans',sans-serif;color:#4F5B80;min-height:44px}
.seg button.on{background:#fff;color:#0F1B3D;font-weight:700;box-shadow:0 1px 4px rgba(15,27,61,.12)}
.tab{border:0;background:transparent;padding:12px 16px;border-radius:999px;font:500 15px 'DM Sans',sans-serif;color:#4F5B80;min-height:44px}
.tab.on{background:#0F1B3D;color:#fff;font-weight:700}
@media (max-width:860px){.main{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.page{padding:28px 20px 40px}}
</style>
</helmet>
<div class="page">
<div class="wrap">
<div class="hero" style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:28px">
<div>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
<svg width="26" height="26" viewBox="0 0 24 24" role="img" aria-label="Logo de Simplex Lab"><polygon points="2,20 6,10 18,8 22,20" fill="#4B4EEB"></polygon><circle cx="20" cy="5" r="3" fill="#FFC93C"></circle></svg>
<span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px">Simplex Lab</span>
</div>
<h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:52px;line-height:1.02;letter-spacing:-1px;max-width:620px">Cada decisión del método, a la vista.</h1>
</div>
<svg width="320" height="120" viewBox="0 0 320 120" aria-hidden="true"><polygon points="17,62 72,27 238,15 299,53 253,107 17,107" fill="#D6D8F8" stroke="#4B4EEB" stroke-width="1.5"></polygon><line x1="17" y1="107" x2="253" y2="107" stroke="#0F1B3D" stroke-width="1.5" stroke-dasharray="4 3"></line><line x1="253" y1="107" x2="299" y2="53" stroke="#4B4EEB" stroke-width="1.5" stroke-dasharray="4 3"></line><circle cx="17" cy="107" r="4.5" fill="#0F1B3D"></circle><circle cx="253" cy="107" r="4.5" fill="#0F1B3D"></circle><circle cx="299" cy="53" r="9" fill="#FFC93C" stroke="#0F1B3D" stroke-width="1.5"></circle></svg>
</div>

<div class="main">
<div class="card">
<h2 style="margin:0 0 20px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px">Tu problema</h2>
<div style="display:flex;align-items:center;gap:14px;margin-bottom:22px">
<div class="seg"><button class="on">Maximizar</button><button>Minimizar</button></div>
<label for="nvars" style="font-size:14px;color:#4F5B80">Variables</label>
<input id="nvars" class="inp" style="width:48px" value="2">
</div>
<label class="lbl" for="ejemplo" style="display:block">Cargar un ejemplo</label>
<select id="ejemplo" class="inp" style="width:100%;text-align:left;padding:0 14px;height:44px;margin-bottom:22px"><option>Región con restricción redundante</option></select>
<p class="lbl">Función objetivo</p>
<div class="row" style="margin-bottom:22px"><b style="color:#0F1B3D;font-size:15px">Z =</b><input class="inp" style="width:52px" aria-label="Coeficiente de x1" value="50"><span>x<sub>1</sub> +</span><input class="inp" style="width:52px" aria-label="Coeficiente de x2" value="80"><span>x<sub>2</sub></span></div>
<p class="lbl">Restricciones</p>
<div class="row"><input class="inp" style="width:52px" aria-label="R1 coeficiente x1" value="2"><span>x<sub>1</sub> +</span><input class="inp" style="width:52px" aria-label="R1 coeficiente x2" value="1"><span>x<sub>2</sub></span><button class="op" aria-label="Menor o igual">≤</button><input class="inp" style="width:52px" aria-label="R1 valor" value="100"></div>
<div class="row"><input class="inp" style="width:52px" aria-label="R2 coeficiente x1" value="1"><span>x<sub>1</sub> +</span><input class="inp" style="width:52px" aria-label="R2 coeficiente x2" value="3"><span>x<sub>2</sub></span><button class="op" aria-label="Menor o igual">≤</button><input class="inp" style="width:52px" aria-label="R2 valor" value="90"></div>
<div class="row"><input class="inp" style="width:52px" aria-label="R3 coeficiente x1" value="0"><span>x<sub>1</sub> +</span><input class="inp" style="width:52px" aria-label="R3 coeficiente x2" value="1"><span>x<sub>2</sub></span><button class="op" aria-label="Menor o igual">≤</button><input class="inp" style="width:52px" aria-label="R3 valor" value="40"></div>
<button style="margin:4px 0 22px;border:1.5px dashed #AEB4D0;background:transparent;color:#4B4EEB;border-radius:10px;padding:10px 14px;font:700 14px 'DM Sans',sans-serif;min-height:44px">Agregar restricción</button>
<div class="seg" style="margin-bottom:18px"><button>Solución directa</button><button class="on">Paso a paso</button></div>
<button style="width:100%;height:52px;border:0;border-radius:14px;background:{{accent}};color:#fff;font:700 17px 'DM Sans',sans-serif;box-shadow:0 8px 20px rgba(75,78,235,.3)">Resolver</button>
</div>

<div class="card">
<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:22px"><button class="tab on">Solución</button><button class="tab">Paso a paso</button><button class="tab">Gráfico</button><button class="tab">Sensibilidad</button></div>
<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
<div style="background:#E6E7FB;border-radius:16px;padding:14px 22px"><div style="font-size:14px;color:#3F42C4">Z óptimo</div><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:58px;line-height:1;color:{{accent}}">3380</div></div>
<div><div style="font-size:13px;color:#4F5B80">x<sub>1</sub></div><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:34px">42</div></div>
<div><div style="font-size:13px;color:#4F5B80">x<sub>2</sub></div><div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:34px">16</div></div>
<span style="margin-left:auto;background:#D9F2E3;color:#0E6B3A;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;align-self:flex-start">Solución óptima</span>
</div>
<svg viewBox="0 0 620 400" width="100%" role="img" aria-label="Región factible con vértices (0,0), (0,30), (42,16) y (50,0); el óptimo está en (42,16) con Z = 3380" style="margin-top:20px;font-family:'DM Sans',sans-serif;font-size:13px;fill:#2A3558">
<polygon points="34,362 34,176 389,262 457,362" fill="#E6E7FB"></polygon>
<line x1="34" y1="362" x2="34" y2="10" stroke="#AEB4D0" stroke-width="1.5"></line>
<line x1="34" y1="362" x2="608" y2="362" stroke="#AEB4D0" stroke-width="1.5"></line>
<line x1="213" y1="5" x2="457" y2="362" stroke="#5C6590" stroke-width="1.5"></line>
<line x1="34" y1="114" x2="608" y2="114" stroke="#5C6590" stroke-width="1.5"></line>
<line x1="34" y1="176" x2="608" y2="317" stroke="#5C6590" stroke-width="1.5"></line>
<line x1="34" y1="100" x2="608" y2="362" stroke="#4B4EEB" stroke-width="2" stroke-dasharray="6 5"></line>
<text x="14" y="20">x₂</text><text x="596" y="384">x₁</text>
<text x="222" y="18">R1</text><text x="570" y="108">R3</text><text x="570" y="306">R2</text>
<circle cx="34" cy="362" r="5" fill="#0F1B3D"></circle><circle cx="34" cy="176" r="5" fill="#0F1B3D"></circle><circle cx="457" cy="362" r="5" fill="#0F1B3D"></circle>
<text x="44" y="356">(0, 0)</text><text x="44" y="164">(0, 30)  Z = 2400</text><text x="372" y="356" text-anchor="end">(50, 0)  Z = 2500</text>
<circle cx="389" cy="262" r="11" fill="#FFC93C" stroke="#0F1B3D" stroke-width="1.5"></circle>
<text x="406" y="250" style="font-weight:700">(42, 16)  Z = 3380</text>
</svg>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4B4EEB"},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#4B4EEB' };
}
}
</script>
</body>
</html>
